name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Verify frontend
        run: npm ci && npm run check && npm test && npm run build && npm run smoke

      - name: Verify backend
        run: npm --prefix backend ci && npm run backend-test

      - name: Start API and exercise live contract
        env:
          OFFERSIGNAL_DB_PATH: ${{ runner.temp }}/offersignal.sqlite
          OFFERSIGNAL_CORS_ORIGIN: http://127.0.0.1:4174
        run: |
          npm --prefix backend start > "${{ runner.temp }}/offersignal-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat "${{ runner.temp }}/offersignal-api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --X POST http://127.0.0.1:8787/api/v1/checks             -H 'Content-Type: application/json'             --data '{"label":"CI smoke","channel":"email","score":12,"level":"low","matches":[],"actions":["Verify independently."]}'             > "${{ runner.temp }}/offersignal-response.json"
          RESPONSE="${{ runner.temp }}/offersignal-response.json" python -c 'import json, os; data=json.load(open(os.environ["RESPONSE"])); assert data["check"]["label"] == "CI smoke"; assert "message" not in data["check"]; assert data["expiresAt"] > data["createdAt"]; print(data["id"])' > "${{ runner.temp }}/offersignal-id"
          curl --fail --silent "http://127.0.0.1:8787/api/v1/checks/$(cat "${{ runner.temp }}/offersignal-id")" > /dev/null

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high

      - name: Scan tracked files for common secrets
        run: |
          if git grep -n -E '\\b(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{16,})'; then
            echo "Potential secret detected in tracked files"
            exit 1
          fi
